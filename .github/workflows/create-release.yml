name: Build and Release APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Auto-generate version from date and run number
            echo "VERSION=$(date +%Y.%m.%d).${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/AndroidTVKiosk-v${{ steps.version.outputs.VERSION }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Android TV Kiosk App v${{ steps.version.outputs.VERSION }}

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Features
            - Native Android AlertDialog menu with TV remote D-pad navigation
            - Press back 5 times to open menu
            - Settings to change kiosk URL
            - Auto-start on device boot
            - Fullscreen kiosk mode

            ### Installation
            1. Download `AndroidTVKiosk-v${{ steps.version.outputs.VERSION }}.apk` below
            2. Install on your Android TV or Android phone
            3. Press back button 5 times to access settings
            4. Use D-pad arrows to navigate menu items

            ### Requirements
            - Android 9.0+ (API 28+)
            - Works on Android TV and Android phones
          files: |
            android/app/build/outputs/apk/release/AndroidTVKiosk-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
